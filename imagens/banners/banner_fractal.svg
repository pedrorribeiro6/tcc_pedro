<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="fGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="40%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <radialGradient id="fglow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="rgba(16, 185, 129, 0.4)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#fGrad)"/>
  <rect width="1200" height="360" fill="url(#fglow)"/>
  
  <!-- Círculos concêntricos e fractais -->
  <g fill="none" stroke="rgba(52, 211, 153, 0.25)" stroke-width="1.5">
    <circle cx="700" cy="180" r="140"/>
    <circle cx="700" cy="180" r="100"/>
    <circle cx="700" cy="180" r="60"/>
    <circle cx="700" cy="180" r="30"/>
    <circle cx="560" cy="180" r="40"/>
    <circle cx="840" cy="180" r="40"/>
    <circle cx="700" cy="80" r="40"/>
    <circle cx="700" cy="280" r="40"/>
  </g>
  
  <text x="300" y="200" font-family="'Outfit', sans-serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.15)" letter-spacing="4">UNIVERSO FRACTAL &bull; &infin;</text>
</svg>
