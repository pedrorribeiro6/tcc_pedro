<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="rgba(0, 168, 255, 0.35)"/>
      <stop offset="100%" stop-color="rgba(0, 168, 255, 0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="60%" r="40%">
      <stop offset="0%" stop-color="rgba(251, 191, 36, 0.3)"/>
      <stop offset="100%" stop-color="rgba(251, 191, 36, 0)"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#glow1)"/>
  <rect width="1200" height="360" fill="url(#glow2)"/>
  
  <!-- Linhas de Blueprint e Grade Matemática -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
  </g>
  
  <!-- Círculos e Formas Geométricas -->
  <circle cx="850" cy="180" r="110" fill="none" stroke="rgba(0, 168, 255, 0.25)" stroke-width="2" stroke-dasharray="6 4"/>
  <circle cx="850" cy="180" r="70" fill="none" stroke="rgba(251, 191, 36, 0.35)" stroke-width="1.5"/>
  <polygon points="850,90 928,225 772,225" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5"/>
  
  <!-- Onda Senoidal Decorativa -->
  <path d="M 0 240 Q 150 160 300 240 T 600 240 T 900 240 T 1200 240" fill="none" stroke="rgba(0, 210, 255, 0.35)" stroke-width="3"/>
  <path d="M 0 260 Q 150 200 300 260 T 600 260 T 900 260 T 1200 260" fill="none" stroke="rgba(251, 191, 36, 0.25)" stroke-width="2"/>
  
  <!-- Símbolos Matemáticos Sutis -->
  <text x="180" y="110" font-family="'Outfit', sans-serif" font-size="44" font-weight="800" fill="rgba(255,255,255,0.06)">&pi;</text>
  <text x="480" y="140" font-family="'Outfit', sans-serif" font-size="52" font-weight="800" fill="rgba(255,255,255,0.05)">&sum;</text>
  <text x="740" y="110" font-family="'Outfit', sans-serif" font-size="48" font-weight="800" fill="rgba(255,255,255,0.06)">&int;</text>
  <text x="1060" y="290" font-family="'Outfit', sans-serif" font-size="46" font-weight="800" fill="rgba(255,255,255,0.06)">&infin;</text>
</svg>
